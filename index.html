<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Newsletter System Wizard</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              sans: [
                "ui-sans-serif",
                "system-ui",
                "-apple-system",
                "Segoe UI",
                "Roboto",
                "Helvetica",
                "Arial",
                "Apple Color Emoji",
                "Segoe UI Emoji"
              ]
            }
          }
        }
      };
    </script>

    <link rel="stylesheet" href="./style.css" />
  </head>

  <body class="h-full bg-zinc-50 text-zinc-900 dark:bg-zinc-950 dark:text-zinc-50">
    <div id="app" class="h-full"></div>

    <template id="tpl-icon-sun">
      <svg viewBox="0 0 24 24" fill="none" class="h-5 w-5"><path stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 3v2m0 14v2m9-9h-2M5 12H3m15.364-6.364-1.414 1.414M7.05 16.95l-1.414 1.414m12.728 0-1.414-1.414M7.05 7.05 5.636 5.636M12 8a4 4 0 1 0 0 8a4 4 0 0 0 0-8Z"/></svg>
    </template>

    <template id="tpl-icon-moon">
      <svg viewBox="0 0 24 24" fill="none" class="h-5 w-5"><path stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M21 13.4A8.5 8.5 0 0 1 10.6 3A6.5 6.5 0 1 0 21 13.4Z"/></svg>
    </template>

    <template id="tpl-icon-check">
      <svg viewBox="0 0 24 24" fill="none" class="h-5 w-5"><path stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M20 6L9 17l-5-5"/></svg>
    </template>

    <template id="tpl-icon-download">
      <svg viewBox="0 0 24 24" fill="none" class="h-5 w-5"><path stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 3v10m0 0 4-4m-4 4-4-4M4 17v3h16v-3"/></svg>
    </template>

    <template id="tpl-icon-plus">
      <svg viewBox="0 0 24 24" fill="none" class="h-5 w-5"><path stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 5v14M5 12h14"/></svg>
    </template>

    <template id="tpl-icon-library">
      <svg viewBox="0 0 24 24" fill="none" class="h-5 w-5"><path stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 19V6a2 2 0 0 1 2-2h12v17M8 6h8M8 10h8M8 14h8"/></svg>
    </template>

    <template id="tpl-icon-wand">
      <svg viewBox="0 0 24 24" fill="none" class="h-5 w-5"><path stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 3l.8 2.6L15 6l-2.2.4L12 9l-.8-2.6L9 6l2.2-.4L12 3Zm7 6-1.6.6L17 11l-.4-1.4L15 9l1.6-.6L17 7l.4 1.4L19 9ZM6 13l.8 2.6L9 16l-2.2.4L6 19l-.8-2.6L3 16l2.2-.4L6 13Zm4.5 2.5 10-10"/></svg>
    </template>

    <script src="./script.js" defer></script>
  </body>
</html>
